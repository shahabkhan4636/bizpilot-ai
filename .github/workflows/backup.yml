name: database-backup

# Vercel's filesystem is ephemeral, so a "backup cron" cannot live there: the file
# would be gone with the next deploy. This runs where a real shell exists, dumps the
# Postgres database named by the DATABASE_URL secret, and keeps the artefact for 30
# days. Restore with `npm run db:restore -- <file>`.

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Install pg_dump 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the DATABASE_URL repository secret before enabling this workflow."
            exit 1
          fi
          mkdir -p backups
          pg_dump --no-owner --no-privileges --format=custom \
            --file="backups/bizpilot-$(date -u +%Y-%m-%dT%H%M).dump" "$DATABASE_URL"
          ls -lh backups

      - uses: actions/upload-artifact@v4
        with:
          name: db-dump
          path: backups/*.dump
          retention-days: 30
